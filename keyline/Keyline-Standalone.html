const KEYLINE_DURABLE_DB = "keyline-progress-durable";
const KEYLINE_DURABLE_STORE = "kv";
function keylineManagedStorageKey(key) {
  return key === "cw-trainer-progress" || /^cw-trainer-/.test(key) || /^keyline[.-]/.test(key);
}
function keylineOpenDurableDb() {
  return new Promise((resolve, reject) => {
    if (!("indexedDB" in window)) return reject(new Error("IndexedDB unavailable"));
    const request = indexedDB.open(KEYLINE_DURABLE_DB, 1);
    request.onupgradeneeded = () => {
      if (!request.result.objectStoreNames.contains(KEYLINE_DURABLE_STORE)) {
        request.result.createObjectStore(KEYLINE_DURABLE_STORE, { keyPath: "key" });
      }
    };
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error || new Error("IndexedDB open failed"));
    request.onblocked = () => reject(new Error("IndexedDB open was blocked"));
  });
}
function keylineReadDurableRecords(db) {
  return new Promise((resolve, reject) => {
    const request = db.transaction(KEYLINE_DURABLE_STORE, "readonly").objectStore(KEYLINE_DURABLE_STORE).getAll();
    request.onsuccess = () => resolve(request.result || []);
    request.onerror = () => reject(request.error || new Error("IndexedDB read failed"));
  });
}
function keylineSaveDurableRecords(db, records) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(KEYLINE_DURABLE_STORE, "readwrite");
    records.forEach(record => tx.objectStore(KEYLINE_DURABLE_STORE).put(record));
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error || new Error("IndexedDB write failed"));
    tx.onabort = () => reject(tx.error || new Error("IndexedDB write aborted"));
  });
}
function keylineLocalStorageEntries() {
  const entries = [];
  try {
    for (let i = 0; i < localStorage.length; i++) {
      const key = localStorage.key(i);
      if (key && keylineManagedStorageKey(key)) {
        const value = localStorage.getItem(key);
        if (value !== null) entries.push({key, value, updatedAt: new Date().toISOString(), schema: 1});
      }
    }
  } catch (_) {}
  return entries;
}
function keylineMigrateStorageAlias(target, patterns) {
  if (localStorage.getItem(target) !== null) return false;
  const candidates = [];
  for (let i = 0; i < localStorage.length; i++) {
    const key = localStorage.key(i);
    if (!key || key === target) continue;
    for (const pattern of patterns) {
      const match = key.match(pattern);
      if (match) {
        const value = localStorage.getItem(key);
        if (value !== null) candidates.push({value, version: Number(match[1] || 0)});
      }
    }
  }
  if (!candidates.length) return false;
  candidates.sort((a,b) => b.version - a.version);
  localStorage.setItem(target, candidates[0].value);
  return true;
}
async function keylineRestoreBeforeBoot() {
  let db;
  try { db = await keylineOpenDurableDb(); } catch (_) { return {restored: 0, migrated: 0}; }
  let restored = 0, migrated = 0;
  try {
    const records = await keylineReadDurableRecords(db);
    for (const record of records) {
      if (!record || typeof record.key !== "string" || !keylineManagedStorageKey(record.key) || typeof record.value !== "string") continue;
      let value = null;
      try { value = localStorage.getItem(record.key); } catch (_) {}
      if (value === null) {
        try { localStorage.setItem(record.key, record.value); restored++; } catch (_) {}
      }
    }
    const migrations = [
      ["cw-trainer-progress", [/^cw-trainer-progress-v(\d+)$/, /^keyline-progress-v(\d+)$/]],
      ["keyline-settings-v1", [/^keyline-settings-v(\d+)$/]],
      ["keyline-custom-codebook-v1", [/^keyline-custom-codebook-v(\d+)$/]],
      ["keyline-transmission-history-v1", [/^keyline-transmission-history-v(\d+)$/]],
      ["keyline.expanded.practice.v1", [/^keyline\.expanded\.practice\.v(\d+)$/]],
      ["keyline.studio.plus.v3", [/^keyline\.studio\.plus\.v(\d+)$/]]
    ];
    for (const [target, patterns] of migrations) {
      try { if (keylineMigrateStorageAlias(target, patterns)) migrated++; } catch (_) {}
    }
    await keylineSaveDurableRecords(db, keylineLocalStorageEntries());
  } catch (_) {}
  try { db.close(); } catch (_) {}
  return {restored, migrated};
}
